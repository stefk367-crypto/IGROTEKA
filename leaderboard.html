<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рейтинг гравців — ІГРОТЕКА</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  .back {
    display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 12px;
    color: var(--text-dim); margin-bottom: 20px; border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 8px;
  }
  .back:hover { color: var(--yellow); border-color: var(--yellow); }

  header { text-align: center; margin-bottom: 28px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--text); margin: 0 0 6px; }
  .subtitle { color: var(--text-dim); font-size: 13px; }

  .board {
    background: var(--paper); border-radius: 18px; overflow: hidden;
    box-shadow: 0 10px 0 -4px rgba(0,0,0,0.18), 0 14px 24px -10px rgba(0,0,0,0.4);
  }
  .row {
    display: flex; align-items: center; gap: 14px; padding: 14px 20px; cursor: pointer;
    border-bottom: 1px solid rgba(0,0,0,0.06); transition: background .15s ease;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: rgba(0,0,0,0.03); }
  .row.me { background: #fff3cf; }
  .rank { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: #7a6b52; width: 28px; flex: 0 0 auto; text-align: center; }
  .rank.top1 { color: #d4a017; }
  .rank.top2 { color: #9aa0a6; }
  .rank.top3 { color: #b5651d; }
  .row-avatar {
    width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex: 0 0 auto;
    background: var(--bg-panel); display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .row-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .row-info { flex: 1; min-width: 0; }
  .row-name { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { font-size: 11.5px; color: #7a6b52; }
  .row-level { font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--magenta); flex: 0 0 auto; text-align: right; }
  .row-level small { display: block; font-size: 9.5px; font-weight: 700; color: #7a6b52; text-transform: uppercase; letter-spacing: 0.05em; }

  .empty-note { text-align: center; color: var(--text-dim); font-size: 13px; padding: 44px 20px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← До полиці</a>
  <header>
    <h1>🏆 Рейтинг гравців</h1>
    <p class="subtitle">Топ за рівнем — серед тих, хто входив через Google або GitHub.</p>
  </header>
  <div class="board" id="board"></div>
</div>

<script src="config.js"></script>
<script src="supabase-sync.js"></script>
<script src="engine.js"></script>
<script>
Engine.mountCoinBadge(document.body, '');

async function waitForSupaReady(timeoutMs) {
  const start = Date.now();
  while (!(window.SupaSync && SupaSync.ready) && Date.now() - start < (timeoutMs || 3000)) {
    await new Promise(r => setTimeout(r, 50));
  }
}

(async function() {
  const board = document.getElementById('board');
  board.innerHTML = '<div class="empty-note">Завантаження…</div>';

  if (!window.SupaSync) {
    board.innerHTML = '<div class="empty-note">Рейтинг недоступний — Supabase не налаштовано.</div>';
    return;
  }
  await waitForSupaReady();

  const rows = await SupaSync.fetchLeaderboard(50);
  if (!rows.length) {
    board.innerHTML = '<div class="empty-note">Рейтинг поки порожній — заходь через Google або GitHub і грай, щоб з’явитися тут першим.</div>';
    return;
  }

  const myId = SupaSync.user ? SupaSync.user.id : null;
  board.innerHTML = rows.map((r, i) => {
    const rank = i + 1;
    const rankCls = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
    const avatar = r.avatar_url ? `<img src="${r.avatar_url}" alt="">` : '👤';
    return `<div class="row ${r.id === myId ? 'me' : ''}" data-id="${r.id}">
      <div class="rank ${rankCls}">${rank}</div>
      <div class="row-avatar">${avatar}</div>
      <div class="row-info">
        <div class="row-name">${r.name || 'Гравець'}</div>
        <div class="row-sub">🏆 ${r.achievements || 0} досягнень</div>
      </div>
      <div class="row-level"><small>рівень</small>${r.level}</div>
    </div>`;
  }).join('');

  board.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => {
      window.location.href = 'player.html?id=' + encodeURIComponent(row.dataset.id);
    });
  });
})();
</script>
</body>
</html>
