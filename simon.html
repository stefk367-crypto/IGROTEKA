<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Саймон — ІГРОТЕКА</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 60px; text-align: center; }
  .back {
    display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 12px;
    color: var(--text-dim); margin-bottom: 24px; border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 8px;
  }
  .back:hover { color: var(--yellow); border-color: var(--yellow); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; color: var(--text); margin: 0 0 6px; }
  .status-row { display: flex; justify-content: center; gap: 30px; margin: 18px auto 20px; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--yellow); }

  .simon {
    position: relative; width: 320px; height: 320px; margin: 0 auto; border-radius: 50%;
    background: var(--line);
  }
  .quad {
    position: absolute; width: 152px; height: 152px; cursor: pointer;
    opacity: 0.55; transition: opacity 0.1s ease;
  }
  .quad.lit { opacity: 1; filter: brightness(1.3); }
  .quad.tl { top: 6px; left: 6px; background: #ef6b52; border-radius: 100% 0 0 0; }
  .quad.tr { top: 6px; right: 6px; background: #f0a93b; border-radius: 0 100% 0 0; }
  .quad.bl { bottom: 6px; left: 6px; background: #5fd0c2; border-radius: 0 0 0 100%; }
  .quad.br { bottom: 6px; right: 6px; background: #f4ede0; border-radius: 0 0 100% 0; }
  .center-btn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 100px; height: 100px; border-radius: 50%; background: var(--bg);
    display: flex; align-items: center; justify-content: center; font-family: var(--font-display);
    font-weight: 700; font-size: 12px; color: var(--text); z-index: 2; cursor: pointer;
  }

  .overlay-msg { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--yellow); margin-top: 22px; min-height: 22px; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 11px 18px;
    background: var(--yellow); border: none; color: #2c2008; border-radius: 10px; cursor: pointer; margin-top: 10px;
  }
  .btn:hover { filter: brightness(1.08); }
  .hint { margin-top: 18px; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← До полиці</a>
  <h1 class="crt-flicker">САЙМОН</h1>
  <div class="status-row">
    <span id="round">РАУНД: 0</span>
    <span id="best">РЕКОРД: 0</span>
  </div>

  <div class="simon">
    <div class="quad tl" data-i="0"></div>
    <div class="quad tr" data-i="1"></div>
    <div class="quad bl" data-i="2"></div>
    <div class="quad br" data-i="3"></div>
    <div class="center-btn" id="centerBtn">СТАРТ</div>
  </div>

  <div class="overlay-msg" id="msg"></div>
  <p class="hint">Запам'ятовуй послідовність, що показує гра, і повторюй її клікаючи по секторах.</p>
</div>

<script src="../engine.js"></script>
<script>
const sound = new Engine.SoundFX();
Engine.mountMuteButton(sound, document.body);
Engine.mountCoinBadge(document.body, '../');

const FREQS = [330, 415, 247, 523];
const quads = Array.from(document.querySelectorAll('.quad'));
const centerBtn = document.getElementById('centerBtn');
const msgEl = document.getElementById('msg');

let sequence, playerStep, round, best, running, accepting;

best = 0;
try { best = Number(localStorage.getItem('simon_best') || 0); } catch(e) {}
document.getElementById('best').textContent = 'РЕКОРД: ' + best;

function lightUp(i, duration = 320) {
  return new Promise(resolve => {
    const q = quads[i];
    q.classList.add('lit');
    sound.tone(FREQS[i], duration/1000 * 0.9, 'triangle', 0.16);
    setTimeout(() => { q.classList.remove('lit'); resolve(); }, duration);
  });
}

async function playSequence() {
  accepting = false;
  await new Promise(r => setTimeout(r, 400));
  for (const i of sequence) {
    await lightUp(i, Math.max(280, 550 - round*15));
    await new Promise(r => setTimeout(r, 140));
  }
  accepting = true;
  playerStep = 0;
}

function nextRound() {
  round++;
  document.getElementById('round').textContent = 'РАУНД: ' + round;
  sequence.push(Math.floor(Math.random()*4));
  playSequence();
}

function start() {
  sequence = [];
  round = 0;
  running = true;
  msgEl.textContent = '';
  centerBtn.textContent = '...';
  nextRound();
}

function onQuadClick(i) {
  if (!running || !accepting) return;
  lightUp(i, 180);
  if (i === sequence[playerStep]) {
    playerStep++;
    if (playerStep === sequence.length) {
      accepting = false;
      setTimeout(nextRound, 500);
    }
  } else {
    fail();
  }
}

function fail() {
  running = false;
  accepting = false;
  sound.hit();
  sound.gameOver();
  const finalRound = round - 1;
  if (finalRound > best) {
    best = finalRound;
    try { localStorage.setItem('simon_best', best); } catch(e) {}
    document.getElementById('best').textContent = 'РЕКОРД: ' + best;
  }
  const earned = Math.max(1, finalRound * 4);
  Engine.CoinBank.add(earned);
  msgEl.textContent = `ПОМИЛКА НА РАУНДІ ${round} · +${earned} монет`;
  centerBtn.textContent = 'ЩЕ РАЗ';
}

quads.forEach(q => q.addEventListener('click', () => onQuadClick(Number(q.dataset.i))));
centerBtn.addEventListener('click', () => { if (!running) start(); });
</script>
</body>
</html>
