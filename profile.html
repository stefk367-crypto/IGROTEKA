<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профіль гравця — ІГРОТЕКА</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 880px; margin: 0 auto; padding: 56px 24px 90px; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 40px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px;
    font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--text-dim);
  }
  .back-link:hover { color: var(--text); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 5vw, 46px); margin: 0; color: var(--text); }

  #authSlot { display: flex; justify-content: center; margin-top: 16px; }

  .panel {
    background: var(--paper); color: var(--ink); border-radius: 18px;
    box-shadow: 0 10px 0 -4px rgba(0,0,0,0.18), 0 14px 24px -10px rgba(0,0,0,0.45);
    padding: 28px 26px; margin-bottom: 24px;
  }

  .level-card { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; justify-content: center; text-align: left; }
  .ring-wrap { position: relative; width: 148px; height: 148px; flex: 0 0 auto; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--paper-alt); stroke-width: 12; }
  .ring-fill { fill: none; stroke: var(--magenta); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 0.4s ease; }
  .ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-label .lvl-num { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; }
  .ring-label .lvl-tag { font-family: var(--font-display); font-weight: 700; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6050; }

  .level-info { flex: 1; min-width: 200px; }
  .level-info .xp-line { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .level-info .xp-sub { font-size: 13px; color: #6b6050; line-height: 1.5; }
  .level-info .cap-note {
    display: inline-block; margin-top: 10px; font-family: var(--font-display); font-weight: 700; font-size: 11.5px;
    background: var(--yellow); color: #2c2008; padding: 5px 10px; border-radius: 999px;
  }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .stat-box { background: var(--paper-alt); border-radius: 12px; padding: 14px 16px; }
  .stat-box .stat-num { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
  .stat-box .stat-label { font-size: 12px; color: #6b6050; margin-top: 2px; }

  h2.section-title { font-family: var(--font-display); font-weight: 800; font-size: 18px; margin: 0 0 14px; color: var(--ink); }

  .records-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .record-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--paper-alt); border-radius: 10px; padding: 10px 14px;
  }
  .record-row .rec-name { font-size: 13.5px; font-weight: 600; }
  .record-row .rec-val { font-family: var(--font-display); font-weight: 800; font-size: 14px; color: var(--magenta); }
  .record-row.empty .rec-val { color: #a89e8a; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html" class="back-link">← На головну</a>
    <h1>👤 Профіль гравця</h1>
    <div id="authSlot"></div>
  </header>

  <section class="panel level-card">
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <circle class="ring-track" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="ring-label">
        <div class="lvl-num" id="lvlNum">1</div>
        <div class="lvl-tag">рівень</div>
      </div>
    </div>
    <div class="level-info">
      <div class="xp-line" id="xpLine">0 / 75 XP</div>
      <div class="xp-sub" id="xpSub">Грай у будь-яку гру — монети, які ти заробляєш, одночасно йдуть у досвід.</div>
      <div id="capNote"></div>
    </div>
  </section>

  <section class="panel">
    <h2 class="section-title">Статистика</h2>
    <div class="stats-grid" id="statsGrid"></div>
  </section>

  <section class="panel">
    <h2 class="section-title">Особисті рекорди</h2>
    <div class="records-grid" id="recordsGrid"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-sync.js"></script>
<script src="engine.js"></script>
<script>
Engine.mountCoinBadge(document.body, '');
mountAuthWidget(document.getElementById('authSlot'));

const RECORD_KEYS = [
  { key: 'snake_best',        name: 'Змійка',    kind: 'high' },
  { key: 'tetris_best',       name: 'Блоки',     kind: 'high' },
  { key: '2048_best',         name: '2048',      kind: 'high' },
  { key: 'flappy_best',       name: 'Літайлик',  kind: 'high' },
  { key: 'simon_best',        name: 'Саймон',    kind: 'high', suffix: ' р.' },
  { key: 'pong_wins',         name: 'Понг',      kind: 'high', suffix: ' перемог' },
  { key: 'spaceshooter_best', name: 'Космобій',  kind: 'high' },
  { key: 'minesweeper_wins',  name: 'Сапер',     kind: 'high', suffix: ' перемог' },
  { key: 'moles_best',        name: 'Кроти',     kind: 'high' },
  { key: 'memory_best_moves', name: "Пам'ять",   kind: 'low',  suffix: ' спроб' },
  { key: 'arkanoid_won',      name: 'Цеглинки',  kind: 'flag' },
  { key: 'platformer_won',    name: 'Стрибун',   kind: 'flag' },
  { key: 'puzzle15_solved',   name: "П'ятнашки", kind: 'flag' }
];

(function paintLevel() {
  const p = Engine.LevelManager.getProgress();
  document.getElementById('lvlNum').textContent = p.level;
  document.getElementById('xpLine').textContent = p.rewardsOver
    ? `${p.xp} XP всього`
    : `${p.xpIntoLevel} / ${p.xpForNext} XP до наступного рівня`;

  const ring = document.getElementById('ringFill');
  const r = 52, circ = 2 * Math.PI * r;
  ring.style.strokeDasharray = circ;
  ring.style.strokeDashoffset = circ * (1 - (p.rewardsOver ? 1 : p.progress));

  if (p.rewardsOver) {
    document.getElementById('xpSub').textContent = 'Рівень і далі росте з кожною грою — це вже просто для похвальби.';
    document.getElementById('capNote').innerHTML = '<span class="cap-note">Максимум нагород досягнуто (100 рівень) — далі без монетних бонусів</span>';
  } else {
    const reward = Engine.LevelManager.rewardForLevel(p.level + 1);
    document.getElementById('xpSub').textContent = `За наступний рівень — бонус +${reward} монет.`;
  }
})();

(function paintStats() {
  const grid = document.getElementById('statsGrid');
  const unlocked = Engine.Achievements.unlocked().length;
  const total = Engine.Achievements.all().length;
  const owned = Engine.ThemeManager.getOwned().length;
  const themesTotal = Object.keys(Engine.THEMES).length;
  const streak = Engine.DailyBonus.getStreak();

  const stats = [
    { num: Engine.CoinBank.get(), label: 'Монет зараз' },
    { num: Engine.CoinBank.getTotalEarned(), label: 'Зароблено за весь час' },
    { num: `${unlocked}/${total}`, label: 'Досягнення' },
    { num: `${owned}/${themesTotal}`, label: 'Тем зібрано' },
    { num: streak, label: 'Серія входів, дн.' }
  ];
  grid.innerHTML = stats.map(s => `
    <div class="stat-box">
      <div class="stat-num">${s.num}</div>
      <div class="stat-label">${s.label}</div>
    </div>`).join('');
})();

(function paintRecords() {
  const grid = document.getElementById('recordsGrid');
  grid.innerHTML = RECORD_KEYS.map(r => {
    const v = safeNum(r.key);
    let display, empty = false;
    if (r.kind === 'flag') {
      display = v >= 1 ? '✅ пройдено' : '—';
      empty = v < 1;
    } else {
      display = v > 0 ? v + (r.suffix || '') : '—';
      empty = v <= 0;
    }
    return `<div class="record-row ${empty ? 'empty' : ''}">
      <span class="rec-name">${r.name}</span>
      <span class="rec-val">${display}</span>
    </div>`;
  }).join('');
})();
</script>
</body>
</html>
