<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сапер — ІГРОТЕКА</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { max-width: 620px; margin: 0 auto; padding: 32px 20px 60px; text-align: center; }
  .back {
    display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 12px;
    color: var(--text-dim); margin-bottom: 24px; border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 8px;
  }
  .back:hover { color: var(--yellow); border-color: var(--yellow); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; color: var(--text); margin: 0 0 6px; }
  .status-row { display: flex; justify-content: center; gap: 30px; margin: 18px auto 20px; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--yellow); }
  .board {
    display: inline-grid; grid-template-columns: repeat(10, 1fr); gap: 3px;
    background: var(--line); padding: 6px; border-radius: 10px;
  }
  .cell {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    background: var(--bg-panel-raised); border-radius: 4px; cursor: pointer; user-select: none;
    font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--text);
  }
  .cell.open { background: var(--paper); color: var(--ink); cursor: default; }
  .cell.mine { background: var(--magenta); }
  .cell.flag { color: var(--yellow); }
  .overlay-msg { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--yellow); margin-top: 18px; min-height: 22px; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 11px 18px;
    background: var(--yellow); border: none; color: #2c2008; border-radius: 10px; cursor: pointer; margin-top: 10px;
  }
  .btn:hover { filter: brightness(1.08); }
  .hint { margin-top: 18px; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
  @media (max-width: 420px) {
    .cell { width: 26px; height: 26px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← До полиці</a>
  <h1 class="crt-flicker">САПЕР</h1>
  <div class="status-row">
    <span id="mines">МІНИ: 12</span>
    <span id="timer">ЧАС: 0с</span>
  </div>
  <div class="board" id="board"></div>
  <div class="overlay-msg" id="msg"></div>
  <button class="btn" id="startBtn">Нова гра</button>
  <p class="hint">Клік — відкрити клітинку. Правий клік (або довге натискання) — поставити прапорець.</p>
</div>

<script src="../engine.js"></script>
<script>
const boardEl = document.getElementById('board');
const sound = new Engine.SoundFX();
Engine.mountMuteButton(sound, document.body);
Engine.mountFullscreenButton(document.body);
Engine.mountCoinBadge(document.body, '../');

const ROWS = 10, COLS = 10, MINES = 12;
let grid, revealedCount, running, flagsUsed, timer, seconds, started;

function buildGrid() {
  const g = Array.from({length: ROWS}, () => Array.from({length: COLS}, () => ({ mine:false, open:false, flag:false, count:0 })));
  let placed = 0;
  while (placed < MINES) {
    const r = Math.floor(Math.random()*ROWS), c = Math.floor(Math.random()*COLS);
    if (!g[r][c].mine) { g[r][c].mine = true; placed++; }
  }
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    if (g[r][c].mine) continue;
    let n = 0;
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) {
      const rr=r+dr, cc=c+dc;
      if (rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&g[rr][cc].mine) n++;
    }
    g[r][c].count = n;
  }
  return g;
}

function reset() {
  grid = buildGrid();
  revealedCount = 0;
  flagsUsed = 0;
  running = true;
  started = false;
  seconds = 0;
  clearInterval(timer);
  document.getElementById('mines').textContent = 'МІНИ: ' + (MINES - flagsUsed);
  document.getElementById('timer').textContent = 'ЧАС: 0с';
  document.getElementById('msg').textContent = '';
  render();
}

function startTimer() {
  if (started) return;
  started = true;
  timer = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = 'ЧАС: ' + seconds + 'с';
  }, 1000);
}

function openCell(r, c) {
  if (!running) return;
  const cell = grid[r][c];
  if (cell.open || cell.flag) return;
  startTimer();
  cell.open = true;
  revealedCount++;

  if (cell.mine) {
    sound.hit();
    endGame(false);
    return;
  }
  sound.blip();

  if (cell.count === 0) {
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) {
      const rr=r+dr, cc=c+dc;
      if (rr>=0&&rr<ROWS&&cc>=0&&cc<COLS && !grid[rr][cc].open) openCell(rr, cc);
    }
  }

  if (revealedCount === ROWS*COLS - MINES) endGame(true);
  render();
}

function toggleFlag(r, c, e) {
  e.preventDefault();
  if (!running) return;
  const cell = grid[r][c];
  if (cell.open) return;
  cell.flag = !cell.flag;
  flagsUsed += cell.flag ? 1 : -1;
  document.getElementById('mines').textContent = 'МІНИ: ' + (MINES - flagsUsed);
  sound.rotate();
  render();
}

function endGame(won) {
  running = false;
  clearInterval(timer);
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (grid[r][c].mine) grid[r][c].open = true;
  if (won) {
    sound.win();
    const earned = Math.max(10, 100 - seconds);
    Engine.CoinBank.add(earned);
    let wins = 0;
    try { wins = Number(localStorage.getItem('minesweeper_wins') || 0); } catch (e) {}
    try { localStorage.setItem('minesweeper_wins', wins + 1); } catch (e) {}
    document.getElementById('msg').textContent = `ПЕРЕМОГА ЗА ${seconds}с · +${earned} монет`;
  } else {
    sound.gameOver();
    document.getElementById('msg').textContent = 'БУМ! ТИ ПІДІРВАВСЯ НА МІНІ';
  }
  render();
}

function render() {
  boardEl.innerHTML = '';
  for (let r=0;r<ROWS;r++) {
    for (let c=0;c<COLS;c++) {
      const cell = grid[r][c];
      const el = document.createElement('div');
      el.className = 'cell' + (cell.open ? ' open' : '') + (cell.open && cell.mine ? ' mine' : '') + (cell.flag && !cell.open ? ' flag' : '');
      if (cell.open) {
        if (cell.mine) el.textContent = '💣';
        else if (cell.count > 0) el.textContent = cell.count;
      } else if (cell.flag) {
        el.textContent = '🚩';
      }
      el.addEventListener('click', () => openCell(r, c));
      el.addEventListener('contextmenu', (e) => toggleFlag(r, c, e));
      let pressTimer;
      el.addEventListener('touchstart', () => { pressTimer = setTimeout(() => toggleFlag(r, c, {preventDefault(){}}), 450); }, {passive:true});
      el.addEventListener('touchend', () => clearTimeout(pressTimer));
      boardEl.appendChild(el);
    }
  }
}

document.getElementById('startBtn').addEventListener('click', reset);

reset();
</script>
</body>
</html>
