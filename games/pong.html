<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Понг — ІГРОТЕКА</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { max-width: 700px; margin: 0 auto; padding: 32px 20px 60px; text-align: center; }
  .back {
    display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 12px;
    color: var(--text-dim); margin-bottom: 24px; border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 8px;
  }
  .back:hover { color: var(--magenta); border-color: var(--magenta); }
  h1 {
    font-family: var(--font-display); font-weight: 800; font-size: 30px;
    color: var(--text); margin: 0 0 6px;
  }
  .status-row {
    display: flex; justify-content: space-between; max-width: 560px; margin: 18px auto 14px;
    font-family: var(--font-display); font-weight: 700; font-size: 16px;
  }
  .status-row span.p1 { color: var(--magenta); }
  .status-row span.p2 { color: var(--cyan); }
  #board {
    background: #102725; border: 3px solid var(--line); border-radius: 14px;
    box-shadow: 0 14px 0 -6px rgba(0,0,0,0.25); max-width: 100%; touch-action: none;
  }
  .overlay-msg { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--yellow); margin-top: 14px; min-height: 22px; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 11px 18px;
    background: var(--magenta); border: none; color: var(--paper); border-radius: 10px; cursor: pointer; margin-top: 10px;
  }
  .btn:hover { filter: brightness(1.08); }
  .hint { margin-top: 18px; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
  .touch-controls {
    display: none; flex-direction: column; gap: 8px; align-items: center; margin: 20px auto 0;
  }
  .touch-controls button {
    font-family: var(--font-display); background: var(--bg-panel-raised); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; font-size: 16px; width: 72px; height: 52px;
  }
  @media (hover: none) and (pointer: coarse) { .touch-controls { display: flex; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← До полиці</a>
  <h1 class="crt-flicker">ПОНГ</h1>
  <div class="status-row">
    <span class="p1" id="scoreP1">ТИ: 0</span>
    <span class="p2" id="scoreP2">КОМП'ЮТЕР: 0</span>
  </div>
  <canvas id="board" width="640" height="400"></canvas>
  <div class="overlay-msg" id="msg"></div>
  <button class="btn" id="startBtn">Старт</button>

  <div class="touch-controls" id="touch">
    <button data-a="up">▲</button>
    <button data-a="down">▼</button>
  </div>

  <p class="hint">Керування: стрілки ▲▼ або W/S, або рухай мишею над полем. Перший до 7 очок перемагає.</p>
</div>

<script src="../engine.js"></script>
<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const sound = new Engine.SoundFX();
const particles = new Engine.Particles();
const shake = new Engine.ScreenShake();
Engine.mountMuteButton(sound, document.body);
Engine.mountFullscreenButton(document.body);

const PADDLE_W = 12, PADDLE_H = 78, PADDLE_SPEED = 380;
const WIN_SCORE = 7;

let p1, p2, ball, keys, running, loop, msgEl;
msgEl = document.getElementById('msg');

function reset(serveDir = 1) {
  p1 = { x: 22, y: H/2 - PADDLE_H/2, score: 0 };
  p2 = { x: W - 22 - PADDLE_W, y: H/2 - PADDLE_H/2, score: 0 };
  serveBall(serveDir);
}

function serveBall(dir) {
  const angle = (Math.random() * 0.6 - 0.3);
  const speed = 320;
  ball = {
    x: W/2, y: H/2,
    vx: Math.cos(angle) * speed * dir,
    vy: Math.sin(angle) * speed,
    r: 8
  };
}

keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','w','s','W','S'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.key] = false);

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scale = H / rect.height;
  const y = (e.clientY - rect.top) * scale;
  p1.y = Engine.clamp(y - PADDLE_H/2, 0, H - PADDLE_H);
});

document.getElementById('touch').addEventListener('pointerdown', e => {
  const a = e.target.dataset.a;
  if (a === 'up') keys['ArrowUp'] = true;
  if (a === 'down') keys['ArrowDown'] = true;
});
document.getElementById('touch').addEventListener('pointerup', e => {
  const a = e.target.dataset.a;
  if (a === 'up') keys['ArrowUp'] = false;
  if (a === 'down') keys['ArrowDown'] = false;
});

function update(dt) {
  if (keys['ArrowUp'] || keys['w'] || keys['W']) p1.y -= PADDLE_SPEED * dt;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) p1.y += PADDLE_SPEED * dt;
  p1.y = Engine.clamp(p1.y, 0, H - PADDLE_H);

  const aiCenter = p2.y + PADDLE_H/2;
  const target = ball.y;
  const aiSpeed = PADDLE_SPEED * 0.72;
  if (Math.abs(target - aiCenter) > 6) {
    p2.y += Math.sign(target - aiCenter) * aiSpeed * dt;
  }
  p2.y = Engine.clamp(p2.y, 0, H - PADDLE_H);

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; sound.blip(); }
  if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy *= -1; sound.blip(); }

  // зіткнення з ракетками
  if (ball.vx < 0 && ball.x - ball.r < p1.x + PADDLE_W && ball.x - ball.r > p1.x - 14 &&
      ball.y > p1.y - ball.r && ball.y < p1.y + PADDLE_H + ball.r) {
    const rel = (ball.y - (p1.y + PADDLE_H/2)) / (PADDLE_H/2);
    const speed = Math.min(620, Math.hypot(ball.vx, ball.vy) * 1.06);
    ball.vx = Math.abs(Math.cos(rel*0.9) * speed);
    ball.vy = Math.sin(rel*0.9) * speed;
    ball.x = p1.x + PADDLE_W + ball.r;
    sound.rotate();
    particles.burst(ball.x, ball.y, '#ef6b52', 8, {speed:2.6, life:16});
  }
  if (ball.vx > 0 && ball.x + ball.r > p2.x && ball.x + ball.r < p2.x + 14 &&
      ball.y > p2.y - ball.r && ball.y < p2.y + PADDLE_H + ball.r) {
    const rel = (ball.y - (p2.y + PADDLE_H/2)) / (PADDLE_H/2);
    const speed = Math.min(620, Math.hypot(ball.vx, ball.vy) * 1.06);
    ball.vx = -Math.abs(Math.cos(rel*0.9) * speed);
    ball.vy = Math.sin(rel*0.9) * speed;
    ball.x = p2.x - ball.r;
    sound.rotate();
    particles.burst(ball.x, ball.y, '#5fd0c2', 8, {speed:2.6, life:16});
  }

  if (ball.x < -30) { score(2); }
  if (ball.x > W + 30) { score(1); }

  particles.update();
  shake.update();
}

function score(who) {
  if (who === 1) { p1.score++; document.getElementById('scoreP1').textContent = 'ТИ: ' + p1.score; }
  else { p2.score++; document.getElementById('scoreP2').textContent = "КОМП'ЮТЕР: " + p2.score; }
  sound.coin();
  shake.trigger(5, 8);
  if (p1.score >= WIN_SCORE || p2.score >= WIN_SCORE) {
    endGame(p1.score > p2.score);
  } else {
    serveBall(who === 1 ? -1 : 1);
  }
}

function endGame(won) {
  running = false;
  loop.stop();
  if (won) {
    sound.win();
    msgEl.textContent = 'ПЕРЕМОГА! ТИ СИЛЬНІШИЙ ЗА КОМП\u2019ЮТЕР';
    let wins = 0;
    try { wins = Number(localStorage.getItem('pong_wins') || 0); } catch (e) {}
    try { localStorage.setItem('pong_wins', wins + 1); } catch (e) {}
  }
  else { sound.gameOver(); msgEl.textContent = 'ПОРАЗКА — КОМП\u2019ЮТЕР ВИЯВИВСЯ СПРИТНІШИМ'; }
  document.getElementById('startBtn').textContent = 'Зіграти ще раз';
}

function render() {
  ctx.save();
  ctx.fillStyle = '#102725';
  ctx.fillRect(0, 0, W, H);
  shake.apply(ctx);

  ctx.strokeStyle = 'rgba(159,184,177,0.3)';
  ctx.setLineDash([8, 10]);
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#ef6b52';
  ctx.fillRect(p1.x, p1.y, PADDLE_W, PADDLE_H);
  ctx.fillStyle = '#5fd0c2';
  ctx.fillRect(p2.x, p2.y, PADDLE_W, PADDLE_H);

  ctx.fillStyle = '#f0a93b';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fill();

  particles.draw(ctx);
  ctx.restore();
}

function start() {
  reset(Math.random() < 0.5 ? 1 : -1);
  msgEl.textContent = '';
  running = true;
  if (loop) loop.stop();
  loop = new Engine.Loop(update, render);
  loop.start();
  document.getElementById('startBtn').textContent = 'Рестарт';
}

document.getElementById('startBtn').addEventListener('click', start);

reset(1);
render();
</script>
</body>
</html>
