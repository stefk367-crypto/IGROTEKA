<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кроти — ІГРОТЕКА</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { max-width: 620px; margin: 0 auto; padding: 32px 20px 60px; text-align: center; }
  .back {
    display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 12px;
    color: var(--text-dim); margin-bottom: 24px; border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 8px;
  }
  .back:hover { color: var(--magenta); border-color: var(--magenta); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; color: var(--text); margin: 0 0 6px; }
  .status-row { display: flex; justify-content: center; gap: 30px; margin: 18px auto 20px; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--yellow); }
  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    max-width: 480px; margin: 0 auto;
  }
  .hole {
    aspect-ratio: 1; border-radius: 50%; background: #0b1f1c; border: 4px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 44px; cursor: pointer;
    overflow: hidden; user-select: none;
  }
  .hole .mole { transform: translateY(120%); transition: transform 0.12s ease; }
  .hole.up .mole { transform: translateY(0); }
  .hole.hit .mole { transform: translateY(120%) scale(0.6); }
  .overlay-msg { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--yellow); margin-top: 18px; min-height: 22px; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 11px 18px;
    background: var(--magenta); border: none; color: var(--paper); border-radius: 10px; cursor: pointer; margin-top: 10px;
  }
  .btn:hover { filter: brightness(1.08); }
  .hint { margin-top: 18px; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← До полиці</a>
  <h1 class="crt-flicker">КРОТИ</h1>
  <div class="status-row">
    <span id="score">РАХУНОК: 0</span>
    <span id="timeLeft">ЧАС: 30с</span>
  </div>
  <div class="board" id="board"></div>
  <div class="overlay-msg" id="msg"></div>
  <button class="btn" id="startBtn">Старт</button>
  <p class="hint">Клікай по кротах, поки вони не сховались. 30 секунд на максимальний рахунок.</p>
</div>

<script src="../engine.js"></script>
<script>
const boardEl = document.getElementById('board');
const sound = new Engine.SoundFX();
Engine.mountMuteButton(sound, document.body);
Engine.mountCoinBadge(document.body, '../');

const HOLES = 9;
let score, running, holeState, spawnTimer, gameTimer, timeLeft;

function buildHoles() {
  boardEl.innerHTML = '';
  for (let i = 0; i < HOLES; i++) {
    const el = document.createElement('div');
    el.className = 'hole';
    el.innerHTML = '<span class="mole">🐹</span>';
    el.addEventListener('click', () => hit(i));
    boardEl.appendChild(el);
  }
}

function reset() {
  score = 0;
  timeLeft = 30;
  holeState = Array(HOLES).fill(false);
  document.getElementById('score').textContent = 'РАХУНОК: 0';
  document.getElementById('timeLeft').textContent = 'ЧАС: 30с';
  document.getElementById('msg').textContent = '';
  buildHoles();
}

function popRandom() {
  if (!running) return;
  const closed = holeState.map((v,i)=>v?-1:i).filter(i=>i>=0);
  if (!closed.length) return;
  const i = closed[Math.floor(Math.random()*closed.length)];
  holeState[i] = true;
  const el = boardEl.children[i];
  el.classList.add('up');
  const upTime = 700 - Math.min(400, (30-timeLeft)*12);
  setTimeout(() => {
    if (holeState[i]) {
      holeState[i] = false;
      el.classList.remove('up');
    }
  }, Math.max(350, upTime));
}

function hit(i) {
  if (!running || !holeState[i]) return;
  holeState[i] = false;
  const el = boardEl.children[i];
  el.classList.remove('up');
  el.classList.add('hit');
  setTimeout(() => el.classList.remove('hit'), 200);
  score++;
  document.getElementById('score').textContent = 'РАХУНОК: ' + score;
  sound.coin();
}

function start() {
  reset();
  running = true;
  document.getElementById('startBtn').textContent = 'Рестарт';
  clearInterval(spawnTimer); clearInterval(gameTimer);
  spawnTimer = setInterval(popRandom, 550);
  gameTimer = setInterval(() => {
    timeLeft--;
    document.getElementById('timeLeft').textContent = 'ЧАС: ' + timeLeft + 'с';
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  running = false;
  clearInterval(spawnTimer);
  clearInterval(gameTimer);
  sound.win();
  const earned = Math.max(1, score);
  Engine.CoinBank.add(earned);
  document.getElementById('msg').textContent = `ЧАС! РАХУНОК ${score} · +${earned} монет`;
  Array.from(boardEl.children).forEach(el => el.classList.remove('up'));
}

document.getElementById('startBtn').addEventListener('click', start);

reset();
</script>
</body>
</html>
