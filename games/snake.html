<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змійка — КОІНЗАЛ</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    text-align: center;
  }
  .back {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 24px;
    border: 1px solid var(--line);
    padding: 8px 12px;
    border-radius: 3px;
  }
  .back:hover { color: var(--cyan); border-color: var(--cyan); }

  h1 {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan), 2px 2px 0 var(--magenta);
    margin: 0 0 6px;
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    max-width: 480px;
    margin: 18px auto 14px;
    font-family: var(--font-display);
    font-size: 12px;
  }
  .status-row span { color: var(--yellow); }

  #board {
    background: #102725;
    border: 3px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 0 30px -6px var(--cyan);
    max-width: 100%;
    touch-action: none;
  }

  .hint {
    margin-top: 18px;
    color: var(--text-dim);
    font-size: 12.5px;
    line-height: 1.7;
  }

  .overlay-msg {
    font-family: var(--font-display);
    font-size: 14px;
    color: var(--magenta);
    margin-top: 14px;
    min-height: 20px;
  }

  .btn {
    font-family: var(--font-display);
    font-size: 11px;
    padding: 10px 16px;
    background: transparent;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    border-radius: 3px;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn:hover { background: var(--cyan); color: #102725; }

  .touch-controls {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 8px;
    justify-content: center;
    margin: 24px auto 0;
  }
  .touch-controls button {
    font-family: var(--font-display);
    background: var(--bg-panel-raised);
    border: 1px solid var(--line);
    color: var(--cyan);
    border-radius: 6px;
    font-size: 16px;
  }
  @media (hover: none) and (pointer: coarse) {
    .touch-controls { display: grid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ ДО ЗАЛИ</a>
  <h1 class="crt-flicker">ЗМІЙКА</h1>
  <div class="status-row">
    <span id="score">РАХУНОК: 0</span>
    <span id="best">РЕКОРД: 0</span>
  </div>
  <canvas id="board" width="480" height="480"></canvas>
  <div class="overlay-msg" id="msg"></div>
  <button class="btn" id="startBtn">▸ СТАРТ</button>

  <div class="touch-controls" id="touch">
    <span></span><button data-dir="up">▲</button><span></span>
    <button data-dir="left">◂</button><span></span><button data-dir="right">▸</button>
    <span></span><button data-dir="down">▼</button><span></span>
  </div>

  <p class="hint">Керування: стрілки або WASD, P — пауза. З'їж жовте яблуко, щоб вирости. Не врізайся в стіни чи в себе.</p>
</div>

<script src="../engine.js"></script>
<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const cell = 24;
const cols = canvas.width / cell;
const rows = canvas.height / cell;

const sound = new Engine.SoundFX();
const particles = new Engine.Particles();
const shake = new Engine.ScreenShake();
Engine.mountMuteButton(sound, document.body);
Engine.mountFullscreenButton(document.body);

let snake, prevSnake, dir, nextDir, food, foodPulse, score, best, paused, tickAcc, tickMs, loop;

best = 0;
try { best = Number(localStorage.getItem('snake_best') || 0); } catch (e) { /* сховище недоступне */ }
document.getElementById('best').textContent = 'РЕКОРД: ' + best;

function reset() {
  snake = [{x: 8, y: 12}, {x: 7, y: 12}, {x: 6, y: 12}];
  prevSnake = snake.map(s => ({...s}));
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  tickMs = 130;
  tickAcc = 0;
  foodPulse = 0;
  paused = false;
  placeFood();
  document.getElementById('score').textContent = 'РАХУНОК: 0';
  document.getElementById('msg').textContent = '';
}

function placeFood() {
  let ok = false;
  while (!ok) {
    food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
    ok = !snake.some(s => s.x === food.x && s.y === food.y);
  }
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  prevSnake = snake.map(s => ({...s}));
  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = 'РАХУНОК: ' + score;
    sound.eat();
    particles.burst(food.x*cell+cell/2, food.y*cell+cell/2, '#ffe94d', 14, {speed: 3.4, life: 22});
    placeFood();
    tickMs = Math.max(60, tickMs - 2);
  } else {
    snake.pop();
    prevSnake.pop();
  }
}

function gameOver() {
  loop.stop();
  sound.hit();
  sound.gameOver();
  shake.trigger(8, 14);
  if (score > best) {
    best = score;
    try { localStorage.setItem('snake_best', best); } catch (e) { /* сховище недоступне */ }
    document.getElementById('best').textContent = 'РЕКОРД: ' + best;
  }
  document.getElementById('msg').textContent = 'ГРУ ЗАВЕРШЕНО — РАХУНОК ' + score;
  document.getElementById('startBtn').textContent = '▸ ЗІГРАТИ ЩЕ РАЗ';
  render(1);
}

function update(dtSec) {
  if (paused) return;
  tickAcc += dtSec * 1000;
  while (tickAcc >= tickMs) {
    tickAcc -= tickMs;
    tick();
    if (!loop.running) break; // tick() may have ended the game
  }
  foodPulse += dtSec * 6;
  particles.update();
  shake.update();
}

function render(alpha) {
  ctx.save();
  ctx.fillStyle = '#102725';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  shake.apply(ctx);

  ctx.strokeStyle = 'rgba(42,51,82,0.35)';
  for (let i = 0; i <= cols; i++) { ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,canvas.height); ctx.stroke(); }
  for (let j = 0; j <= rows; j++) { ctx.beginPath(); ctx.moveTo(0,j*cell); ctx.lineTo(canvas.width,j*cell); ctx.stroke(); }

  const pulse = 1 + Math.sin(foodPulse) * 0.12;
  const fs = (cell - 6) * pulse;
  ctx.fillStyle = '#ffe94d';
  ctx.shadowColor = '#ffe94d';
  ctx.shadowBlur = 12;
  ctx.fillRect(food.x*cell + cell/2 - fs/2, food.y*cell + cell/2 - fs/2, fs, fs);
  ctx.shadowBlur = 0;

  snake.forEach((s, i) => {
    const p = prevSnake[i] || s;
    const x = Engine.lerp(p.x, s.x, alpha);
    const y = Engine.lerp(p.y, s.y, alpha);
    ctx.fillStyle = i === 0 ? '#00f0ff' : 'rgba(0,240,255,0.75)';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = i === 0 ? 10 : 0;
    ctx.fillRect(x*cell+1, y*cell+1, cell-2, cell-2);
  });
  ctx.shadowBlur = 0;

  particles.draw(ctx);

  if (paused) {
    ctx.fillStyle = 'rgba(5,7,12,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffe94d';
    ctx.font = '16px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('ПАУЗА', canvas.width/2, canvas.height/2);
  }

  ctx.restore();
}

function start() {
  reset();
  sound.blip();
  if (loop) loop.stop();
  loop = new Engine.Loop(update, render);
  loop.start();
  document.getElementById('startBtn').textContent = '▸ РЕСТАРТ';
}

document.getElementById('startBtn').addEventListener('click', start);

function setDir(x, y) {
  if (!loop || !loop.running || paused) return;
  if (x === -dir.x && y === -dir.y) return;
  if (x === nextDir.x && y === nextDir.y) return;
  nextDir = { x, y };
  sound.move();
}

window.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
    case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
    case 'p': case 'P': case 'Escape':
      if (loop && loop.running) { paused = !paused; }
      break;
  }
});

document.getElementById('touch').addEventListener('click', e => {
  const dir = e.target.dataset.dir;
  if (!dir) return;
  if (dir === 'up') setDir(0, -1);
  if (dir === 'down') setDir(0, 1);
  if (dir === 'left') setDir(-1, 0);
  if (dir === 'right') setDir(1, 0);
});

reset();
render(1);
</script>
</body>
</html>
