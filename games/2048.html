<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — ІГРОТЕКА</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { max-width: 520px; margin: 0 auto; padding: 32px 20px 60px; text-align: center; }
  .back {
    display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 12px;
    color: var(--text-dim); margin-bottom: 24px; border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 8px;
  }
  .back:hover { color: var(--yellow); border-color: var(--yellow); }
  h1 {
    font-family: var(--font-display); font-weight: 800; font-size: 30px;
    color: var(--text); margin: 0 0 6px;
  }
  .status-row {
    display: flex; justify-content: center; gap: 14px; margin: 18px auto 14px;
  }
  .status-box {
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 18px; font-family: var(--font-display); font-weight: 700;
  }
  .status-box .label { font-size: 9px; color: var(--text-dim); letter-spacing: 0.1em; display: block; margin-bottom: 3px; }
  .status-box .val { font-size: 18px; color: var(--yellow); }

  #board {
    background: #0e2321; border: 3px solid var(--line); border-radius: 14px;
    box-shadow: 0 14px 0 -6px rgba(0,0,0,0.25); max-width: 100%; touch-action: none;
  }

  .overlay-msg { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--yellow); margin-top: 14px; min-height: 22px; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 11px 18px;
    background: var(--yellow); border: none; color: #23180a; border-radius: 10px; cursor: pointer; margin-top: 10px;
  }
  .btn:hover { filter: brightness(1.08); }
  .hint { margin-top: 18px; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← До полиці</a>
  <h1 class="crt-flicker">2048</h1>
  <div class="status-row">
    <div class="status-box"><span class="label">РАХУНОК</span><span class="val" id="score">0</span></div>
    <div class="status-box"><span class="label">РЕКОРД</span><span class="val" id="best">0</span></div>
  </div>
  <canvas id="board" width="420" height="420"></canvas>
  <div class="overlay-msg" id="msg"></div>
  <button class="btn" id="startBtn">Нова гра</button>

  <p class="hint">Керування: стрілки, WASD, або свайп пальцем. Зливай однакові плитки, дійди до 2048.</p>
</div>

<script src="../engine.js"></script>
<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const SIZE = 4;
const CELL = canvas.width / SIZE;
const PAD = 8;

const sound = new Engine.SoundFX();
const particles = new Engine.Particles();
Engine.mountMuteButton(sound, document.body);
Engine.mountFullscreenButton(document.body);

const TILE_COLORS = {
  2: '#e9dfc9', 4: '#e4d3a6', 8: '#f0a93b', 16: '#ef8b52',
  32: '#ef6b52', 64: '#e2503a', 128: '#5fd0c2', 256: '#41b8ab',
  512: '#2f9a8f', 1024: '#f4ede0', 2048: '#f0c93b'
};
function tileColor(v) { return TILE_COLORS[v] || '#2f9a8f'; }
function tileTextColor(v) { return v <= 4 ? '#3a2f22' : '#fbf6ea'; }

let grid, score, best, anims, running, wonAnnounced;

best = 0;
try { best = Number(localStorage.getItem('2048_best') || 0); } catch (e) {}
document.getElementById('best').textContent = best;

function emptyGrid() { return Array.from({length: SIZE}, () => Array(SIZE).fill(0)); }

function randomEmptyCell() {
  const empties = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c] === 0) empties.push([r,c]);
  if (!empties.length) return null;
  return empties[Math.floor(Math.random() * empties.length)];
}

function spawnTile(isNew = true) {
  const cell = randomEmptyCell();
  if (!cell) return;
  const [r, c] = cell;
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  anims.push({ r, c, t: 0, type: 'spawn' });
}

function reset() {
  grid = emptyGrid();
  score = 0;
  wonAnnounced = false;
  anims = [];
  document.getElementById('score').textContent = 0;
  document.getElementById('msg').textContent = '';
  spawnTile(); spawnTile();
  running = true;
  render();
}

function cellCenter(r, c) { return { x: c*CELL + CELL/2, y: r*CELL + CELL/2 }; }

function slide(line) {
  const vals = line.filter(v => v !== 0);
  const merged = [];
  const mergedFlags = [];
  let gained = 0;
  for (let i = 0; i < vals.length; i++) {
    if (i < vals.length - 1 && vals[i] === vals[i+1]) {
      const v = vals[i] * 2;
      merged.push(v);
      mergedFlags.push(true);
      gained += v;
      i++;
    } else {
      merged.push(vals[i]);
      mergedFlags.push(false);
    }
  }
  while (merged.length < SIZE) { merged.push(0); mergedFlags.push(false); }
  return { merged, mergedFlags, gained };
}

function move(dir) {
  if (!running) return;
  // dir: 'left','right','up','down'
  let moved = false;
  let totalGain = 0;
  const mergedCells = [];

  const getLine = (i, reverse) => {
    const line = [];
    for (let j = 0; j < SIZE; j++) {
      const k = reverse ? SIZE - 1 - j : j;
      line.push(dir === 'left' || dir === 'right' ? grid[i][k] : grid[k][i]);
    }
    return line;
  };
  const setLine = (i, line, reverse) => {
    for (let j = 0; j < SIZE; j++) {
      const k = reverse ? SIZE - 1 - j : j;
      const v = line[j];
      if (dir === 'left' || dir === 'right') {
        if (grid[i][k] !== v) moved = true;
        grid[i][k] = v;
      } else {
        if (grid[k][i] !== v) moved = true;
        grid[k][i] = v;
      }
    }
  };

  const reverse = dir === 'right' || dir === 'down';

  for (let i = 0; i < SIZE; i++) {
    const line = getLine(i, reverse);
    const { merged, gained } = slide(line);
    totalGain += gained;
    setLine(i, merged, reverse);
  }

  if (moved) {
    score += totalGain;
    document.getElementById('score').textContent = score;
    if (totalGain > 0) {
      sound.coin();
      particles.burst(canvas.width/2, canvas.height/2, '#f0a93b', 6, {speed: 1.5, life: 14});
    } else {
      sound.move();
    }
    if (score > best) {
      best = score;
      try { localStorage.setItem('2048_best', best); } catch (e) {}
      document.getElementById('best').textContent = best;
    }
    spawnTile();
    render();
    checkGameState();
  }
}

function checkGameState() {
  if (!wonAnnounced) {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 2048) {
        wonAnnounced = true;
        sound.win();
        document.getElementById('msg').textContent = 'ВІТАЄМО! ПЛИТКУ 2048 ЗІБРАНО — МОЖНА ГРАТИ ДАЛІ';
      }
    }
  }
  if (!hasMoves()) {
    running = false;
    sound.gameOver();
    document.getElementById('msg').textContent = 'ГРУ ЗАВЕРШЕНО — ХІД НЕМОЖЛИВИЙ. РАХУНОК ' + score;
  }
}

function hasMoves() {
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (grid[r][c] === 0) return true;
    if (c < SIZE-1 && grid[r][c] === grid[r][c+1]) return true;
    if (r < SIZE-1 && grid[r][c] === grid[r+1][c]) return true;
  }
  return false;
}

function render() {
  ctx.fillStyle = '#0e2321';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      ctx.fillStyle = 'rgba(244,237,224,0.06)';
      ctx.beginPath();
      const x = c*CELL+PAD, y = r*CELL+PAD, w = CELL-PAD*2, h = CELL-PAD*2;
      if (ctx.roundRect) ctx.roundRect(x,y,w,h,10); else ctx.rect(x,y,w,h);
      ctx.fill();
    }
  }

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = grid[r][c];
      if (!v) continue;
      const x = c*CELL+PAD, y = r*CELL+PAD, w = CELL-PAD*2, h = CELL-PAD*2;
      ctx.fillStyle = tileColor(v);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x,y,w,h,10); else ctx.rect(x,y,w,h);
      ctx.fill();
      ctx.fillStyle = tileTextColor(v);
      ctx.font = `700 ${v >= 1000 ? 22 : 28}px 'Baloo 2', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(v, x+w/2, y+h/2+2);
    }
  }

  particles.draw(ctx);
}

window.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowLeft': case 'a': case 'A': move('left'); e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': move('right'); e.preventDefault(); break;
    case 'ArrowUp': case 'w': case 'W': move('up'); e.preventDefault(); break;
    case 'ArrowDown': case 's': case 'S': move('down'); e.preventDefault(); break;
  }
});

// свайпи для сенсорних екранів
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }
  touchStart = null;
}, { passive: true });

document.getElementById('startBtn').addEventListener('click', reset);

reset();
</script>
</body>
</html>
