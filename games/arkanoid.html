<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Цеглинки — ІГРОТЕКА</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { max-width: 700px; margin: 0 auto; padding: 32px 20px 60px; text-align: center; }
  .back {
    display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 12px;
    color: var(--text-dim); margin-bottom: 24px; border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 8px;
  }
  .back:hover { color: var(--cyan); border-color: var(--cyan); }
  h1 {
    font-family: var(--font-display); font-weight: 800; font-size: 30px;
    color: var(--text); margin: 0 0 6px;
  }
  .status-row {
    display: flex; justify-content: space-between; max-width: 560px; margin: 18px auto 14px;
    font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--yellow);
  }
  #board {
    background: #102725; border: 3px solid var(--line); border-radius: 14px;
    box-shadow: 0 14px 0 -6px rgba(0,0,0,0.25); max-width: 100%; touch-action: none;
  }
  .overlay-msg { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--yellow); margin-top: 14px; min-height: 22px; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 11px 18px;
    background: var(--cyan); border: none; color: #102725; border-radius: 10px; cursor: pointer; margin-top: 10px;
  }
  .btn:hover { filter: brightness(1.08); }
  .hint { margin-top: 18px; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
  .touch-controls { display: none; justify-content: center; gap: 14px; margin-top: 20px; }
  .touch-controls button {
    font-family: var(--font-display); background: var(--bg-panel-raised); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; font-size: 18px; width: 72px; height: 52px;
  }
  @media (hover: none) and (pointer: coarse) { .touch-controls { display: flex; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← До полиці</a>
  <h1 class="crt-flicker">ЦЕГЛИНКИ</h1>
  <div class="status-row">
    <span id="score">РАХУНОК: 0</span>
    <span id="lives">ЖИТТЯ: 3</span>
  </div>
  <canvas id="board" width="640" height="440"></canvas>
  <div class="overlay-msg" id="msg"></div>
  <button class="btn" id="startBtn">Старт</button>

  <div class="touch-controls" id="touch">
    <button data-a="left">◂</button>
    <button data-a="right">▸</button>
  </div>

  <p class="hint">Керування: ◂ ▸ або A/D, або рухай мишею. Пробіл — запустити м'яч. Розбий усі цеглинки.</p>
</div>

<script src="../engine.js"></script>
<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const sound = new Engine.SoundFX();
const particles = new Engine.Particles();
const shake = new Engine.ScreenShake();
Engine.mountMuteButton(sound, document.body);
Engine.mountFullscreenButton(document.body);

const PADDLE_W = 96, PADDLE_H = 14, PADDLE_SPEED = 480;
const BALL_R = 8;
const ROWS = 5, COLS = 9, BRICK_W = 62, BRICK_H = 22, BRICK_GAP = 6, BRICK_TOP = 50;
const ROW_COLORS = ['#ef6b52', '#f0a93b', '#5fd0c2', '#f0a93b', '#ef6b52'];

let paddle, ball, bricks, keys, running, loop, lives, score, launched, msgEl;
msgEl = document.getElementById('msg');

function buildBricks() {
  const list = [];
  const totalW = COLS * BRICK_W + (COLS - 1) * BRICK_GAP;
  const startX = (W - totalW) / 2;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      list.push({
        x: startX + c * (BRICK_W + BRICK_GAP),
        y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
        w: BRICK_W, h: BRICK_H,
        color: ROW_COLORS[r % ROW_COLORS.length],
        alive: true
      });
    }
  }
  return list;
}

function resetBall() {
  launched = false;
  ball = { x: paddle.x + PADDLE_W/2, y: paddle.y - BALL_R - 1, vx: 0, vy: 0 };
}

function reset() {
  paddle = { x: W/2 - PADDLE_W/2, y: H - 34 };
  bricks = buildBricks();
  lives = 3;
  score = 0;
  document.getElementById('score').textContent = 'РАХУНОК: 0';
  document.getElementById('lives').textContent = 'ЖИТТЯ: 3';
  resetBall();
}

keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && !launched) { launchBall(); e.preventDefault(); }
  if (['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.key] = false);

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scale = W / rect.width;
  const x = (e.clientX - rect.left) * scale;
  paddle.x = Engine.clamp(x - PADDLE_W/2, 0, W - PADDLE_W);
});
canvas.addEventListener('click', () => { if (!launched && running) launchBall(); });

document.getElementById('touch').addEventListener('pointerdown', e => {
  const a = e.target.dataset.a;
  if (a === 'left') keys['ArrowLeft'] = true;
  if (a === 'right') keys['ArrowRight'] = true;
  if (!launched && running) launchBall();
});
document.getElementById('touch').addEventListener('pointerup', e => {
  const a = e.target.dataset.a;
  if (a === 'left') keys['ArrowLeft'] = false;
  if (a === 'right') keys['ArrowRight'] = false;
});

function launchBall() {
  launched = true;
  const angle = -Math.PI/2 + (Math.random()*0.6 - 0.3);
  const speed = 360;
  ball.vx = Math.cos(angle) * speed;
  ball.vy = Math.sin(angle) * speed;
}

function update(dt) {
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= PADDLE_SPEED * dt;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += PADDLE_SPEED * dt;
  paddle.x = Engine.clamp(paddle.x, 0, W - PADDLE_W);

  if (!launched) {
    ball.x = paddle.x + PADDLE_W/2;
    particles.update(); shake.update();
    return;
  }

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx *= -1; sound.blip(); }
  if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx *= -1; sound.blip(); }
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy *= -1; sound.blip(); }

  // ракетка
  if (ball.vy > 0 && ball.y + BALL_R > paddle.y && ball.y - BALL_R < paddle.y + PADDLE_H &&
      ball.x > paddle.x - BALL_R && ball.x < paddle.x + PADDLE_W + BALL_R) {
    const rel = Engine.clamp((ball.x - (paddle.x + PADDLE_W/2)) / (PADDLE_W/2), -1, 1);
    const speed = Math.min(560, Math.hypot(ball.vx, ball.vy) * 1.03);
    ball.vx = rel * speed * 0.9;
    ball.vy = -Math.sqrt(Math.max(speed*speed*0.16, speed*speed - ball.vx*ball.vx));
    ball.y = paddle.y - BALL_R;
    sound.rotate();
  }

  // цеглинки
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w && ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h) {
      b.alive = false;
      score += 10;
      document.getElementById('score').textContent = 'РАХУНОК: ' + score;
      sound.eat();
      particles.burst(b.x + b.w/2, b.y + b.h/2, b.color, 12, {speed: 3, life: 20});

      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
      if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
      break;
    }
  }

  if (bricks.every(b => !b.alive)) {
    winLevel();
  }

  if (ball.y - BALL_R > H) {
    loseLife();
  }

  particles.update();
  shake.update();
}

function loseLife() {
  lives--;
  sound.hit();
  shake.trigger(6, 10);
  document.getElementById('lives').textContent = 'ЖИТТЯ: ' + lives;
  if (lives <= 0) {
    gameOver();
  } else {
    resetBall();
  }
}

function winLevel() {
  running = false;
  loop.stop();
  sound.win();
  const earned = Math.floor(score / 10) + 20;
  Engine.CoinBank.add(earned);
  msgEl.textContent = 'ПЕРЕМОГА! УСІ ЦЕГЛИНКИ РОЗБИТО — РАХУНОК ' + score + ' · +' + earned + ' монет';
  document.getElementById('startBtn').textContent = 'Зіграти ще раз';
  try { localStorage.setItem('arkanoid_won', '1'); } catch (e) {}
}

function gameOver() {
  running = false;
  loop.stop();
  sound.gameOver();
  const earned = Math.max(1, Math.floor(score / 10));
  Engine.CoinBank.add(earned);
  msgEl.textContent = 'ГРУ ЗАВЕРШЕНО — РАХУНОК ' + score + ' · +' + earned + ' монет';
  document.getElementById('startBtn').textContent = 'Спробувати ще раз';
}

function render() {
  ctx.save();
  ctx.fillStyle = '#102725';
  ctx.fillRect(0, 0, W, H);
  shake.apply(ctx);

  bricks.forEach(b => {
    if (!b.alive) return;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(b.x, b.y, b.w, b.h, 4) : ctx.rect(b.x, b.y, b.w, b.h);
    ctx.fill();
  });

  ctx.fillStyle = '#f4ede0';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(paddle.x, paddle.y, PADDLE_W, PADDLE_H, 7); else ctx.rect(paddle.x, paddle.y, PADDLE_W, PADDLE_H);
  ctx.fill();

  ctx.fillStyle = '#f0a93b';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fill();

  particles.draw(ctx);
  ctx.restore();
}

function start() {
  reset();
  msgEl.textContent = '';
  running = true;
  if (loop) loop.stop();
  loop = new Engine.Loop(update, render);
  loop.start();
  document.getElementById('startBtn').textContent = 'Рестарт';
}

document.getElementById('startBtn').addEventListener('click', start);

reset();
render();
</script>
</body>
</html>
