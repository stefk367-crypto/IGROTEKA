<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>П'ятнашки — ІГРОТЕКА</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 60px; text-align: center; }
  .back {
    display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 12px;
    color: var(--text-dim); margin-bottom: 24px; border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 8px;
  }
  .back:hover { color: var(--cyan); border-color: var(--cyan); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; color: var(--text); margin: 0 0 6px; }
  .status-row { display: flex; justify-content: center; gap: 30px; margin: 18px auto 20px; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--yellow); }
  .board {
    position: relative; width: 400px; height: 400px; margin: 0 auto;
    background: var(--line); border-radius: 12px; padding: 6px;
  }
  .tile {
    position: absolute; width: 92px; height: 92px; border-radius: 8px;
    background: var(--paper); color: var(--ink); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 26px; cursor: pointer;
    transition: top 0.15s ease, left 0.15s ease;
  }
  .overlay-msg { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--yellow); margin-top: 18px; min-height: 22px; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 11px 18px;
    background: var(--cyan); border: none; color: #102725; border-radius: 10px; cursor: pointer; margin-top: 10px;
  }
  .btn:hover { filter: brightness(1.08); }
  .hint { margin-top: 18px; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
  @media (max-width: 440px) {
    .board { width: 320px; height: 320px; }
    .tile { width: 72px; height: 72px; font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← До полиці</a>
  <h1 class="crt-flicker">П'ЯТНАШКИ</h1>
  <div class="status-row">
    <span id="moves">ХОДИ: 0</span>
  </div>
  <div class="board" id="board"></div>
  <div class="overlay-msg" id="msg"></div>
  <button class="btn" id="startBtn">Перемішати</button>
  <p class="hint">Клікай на плитку поруч з порожньою клітинкою, щоб пересунути її. Зберись 1→15 по рядках.</p>
</div>

<script src="../engine.js"></script>
<script>
const boardEl = document.getElementById('board');
const sound = new Engine.SoundFX();
Engine.mountMuteButton(sound, document.body);
Engine.mountCoinBadge(document.body, '../');

const N = 4;
const isSmall = window.matchMedia('(max-width: 440px)').matches;
const TILE = isSmall ? 72 : 92;
const GAP = 4;

let tiles, moves, running;

function solvedOrder() {
  const arr = [];
  for (let i = 1; i < N*N; i++) arr.push(i);
  arr.push(0);
  return arr;
}

function shuffle() {
  let arr = solvedOrder();
  // Робимо перемішування через послідовні валідні ходи — гарантує розв'язність
  let blank = arr.indexOf(0);
  for (let i = 0; i < 400; i++) {
    const neighbors = validMoves(blank);
    const next = neighbors[Math.floor(Math.random()*neighbors.length)];
    [arr[blank], arr[next]] = [arr[next], arr[blank]];
    blank = next;
  }
  return arr;
}

function validMoves(blankIdx) {
  const r = Math.floor(blankIdx / N), c = blankIdx % N;
  const out = [];
  if (r > 0) out.push(blankIdx - N);
  if (r < N-1) out.push(blankIdx + N);
  if (c > 0) out.push(blankIdx - 1);
  if (c < N-1) out.push(blankIdx + 1);
  return out;
}

function reset() {
  tiles = shuffle();
  moves = 0;
  running = true;
  document.getElementById('moves').textContent = 'ХОДИ: 0';
  document.getElementById('msg').textContent = '';
  render();
}

function tileClick(idx) {
  if (!running) return;
  const blank = tiles.indexOf(0);
  if (validMoves(blank).includes(idx)) {
    [tiles[blank], tiles[idx]] = [tiles[idx], tiles[blank]];
    moves++;
    document.getElementById('moves').textContent = 'ХОДИ: ' + moves;
    sound.blip();
    render();
    checkWin();
  }
}

function checkWin() {
  const solved = solvedOrder();
  if (tiles.every((v, i) => v === solved[i])) {
    running = false;
    sound.win();
    const earned = Math.max(10, 120 - moves);
    Engine.CoinBank.add(earned);
    document.getElementById('msg').textContent = `ЗІБРАНО ЗА ${moves} ХОДІВ · +${earned} монет`;
  }
}

function render() {
  boardEl.innerHTML = '';
  tiles.forEach((val, idx) => {
    if (val === 0) return;
    const r = Math.floor(idx / N), c = idx % N;
    const el = document.createElement('div');
    el.className = 'tile';
    el.style.top = (r * (TILE + GAP) + GAP) + 'px';
    el.style.left = (c * (TILE + GAP) + GAP) + 'px';
    el.style.width = TILE + 'px';
    el.style.height = TILE + 'px';
    el.textContent = val;
    el.addEventListener('click', () => tileClick(idx));
    boardEl.appendChild(el);
  });
}

document.getElementById('startBtn').addEventListener('click', reset);

reset();
</script>
</body>
</html>
