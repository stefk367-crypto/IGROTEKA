<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магазин — ІГРОТЕКА</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 70px; }
  .back {
    display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 12px;
    color: var(--text-dim); margin-bottom: 24px; border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 8px;
  }
  .back:hover { color: var(--yellow); border-color: var(--yellow); }

  header { text-align: center; margin-bottom: 36px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 34px; color: var(--text); margin: 0 0 8px; }
  .subtitle { color: var(--text-dim); font-size: 14px; max-width: 460px; margin: 0 auto; line-height: 1.6; }

  .balance {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 18px;
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 20px; font-family: var(--font-display); font-weight: 700; font-size: 18px;
  }
  .balance .dot { color: var(--yellow); }

  .how-to {
    max-width: 460px; margin: 18px auto 0; text-align: center; color: var(--text-dim); font-size: 12.5px; line-height: 1.6;
  }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px; margin-top: 40px;
  }

  .card {
    background: var(--paper); border-radius: 16px; padding: 20px; text-align: center;
    box-shadow: 0 10px 0 -4px rgba(0,0,0,0.18), 0 14px 24px -10px rgba(0,0,0,0.4);
  }

  .swatches { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.15); }

  .theme-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink); margin: 0 0 4px; }
  .theme-price { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: #7a6b52; margin: 0 0 14px; }

  .buy-btn {
    width: 100%; font-family: var(--font-display); font-weight: 700; font-size: 13px;
    padding: 10px; border-radius: 10px; border: none; cursor: pointer;
  }
  .buy-btn.can-buy { background: #1f3a37; color: var(--paper); }
  .buy-btn.owned { background: #cfe8c8; color: #234a1f; cursor: default; }
  .buy-btn.owned.active { background: #f0a93b; color: #3a2a08; }
  .buy-btn.locked { background: #e3d8c0; color: #a89877; cursor: not-allowed; }

  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-panel-raised); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 20px; font-family: var(--font-display); font-weight: 700; font-size: 13px;
    color: var(--text); opacity: 0; transition: all 0.25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← До полиці</a>
  <header>
    <h1>Магазин</h1>
    <p class="subtitle">Заробляй монети, граючи в будь-яку гру на полиці, і купуй кольорові теми для всього порталу.</p>
    <div class="balance"><span class="dot">●</span> <span id="balance">0</span> монет</div>
    <p class="how-to">Монети нараховуються після завершення гри — залежно від рахунку. Куплена тема одразу застосовується на всьому сайті.</p>
  </header>

  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

<script src="engine.js"></script>
<script>
const grid = document.getElementById('grid');
const balanceEl = document.getElementById('balance');
const toastEl = document.getElementById('toast');

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function refreshBalance() {
  balanceEl.textContent = Engine.CoinBank.get();
}

function render() {
  grid.innerHTML = '';
  const owned = Engine.ThemeManager.getOwned();
  const active = Engine.ThemeManager.getActive();
  const coins = Engine.CoinBank.get();

  Object.entries(Engine.THEMES).forEach(([id, theme]) => {
    const card = document.createElement('div');
    card.className = 'card';

    const isOwned = owned.includes(id);
    const isActive = active === id;
    const canAfford = coins >= theme.price;

    let btnClass = 'locked', btnLabel = `Купити за ${theme.price}`;
    if (isOwned) {
      btnClass = isActive ? 'owned active' : 'owned';
      btnLabel = isActive ? 'Активна' : 'Обрати';
    } else if (canAfford) {
      btnClass = 'can-buy';
    }

    card.innerHTML = `
      <div class="swatches">
        <span class="swatch" style="background:${theme.cyan}"></span>
        <span class="swatch" style="background:${theme.magenta}"></span>
        <span class="swatch" style="background:${theme.yellow}"></span>
      </div>
      <h2 class="theme-name">${theme.name}</h2>
      <p class="theme-price">${theme.price === 0 ? 'Базова тема' : theme.price + ' монет'}</p>
      <button class="buy-btn ${btnClass}" ${isActive ? 'disabled' : ''}>${btnLabel}</button>
    `;

    card.querySelector('button').addEventListener('click', () => {
      if (isActive) return;
      if (isOwned) {
        Engine.ThemeManager.setActive(id);
        toast(`Тему «${theme.name}» застосовано`);
        render();
        return;
      }
      if (Engine.CoinBank.spend(theme.price)) {
        Engine.ThemeManager.own(id);
        Engine.ThemeManager.setActive(id);
        toast(`Куплено й застосовано «${theme.name}»`);
        refreshBalance();
        render();
      } else {
        toast('Недостатньо монет');
      }
    });

    grid.appendChild(card);
  });
}

refreshBalance();
render();
</script>
</body>
</html>
