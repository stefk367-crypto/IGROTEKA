<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Блоки — КОІНЗАЛ</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    text-align: center;
  }
  .back {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 24px;
    border: 1px solid var(--line);
    padding: 8px 12px;
    border-radius: 3px;
  }
  .back:hover { color: var(--magenta); border-color: var(--magenta); }

  h1 {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--magenta);
    text-shadow: 0 0 8px var(--magenta), 2px 2px 0 var(--cyan);
    margin: 0 0 20px;
  }

  .game-area {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .side-panel.left { width: 110px; }
  .side-panel.right { width: 150px; text-align: left; }

  #board {
    background: #102725;
    border: 3px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 0 30px -6px var(--magenta);
  }

  .panel-box {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 14px;
  }

  .panel-label {
    font-family: var(--font-display);
    font-size: 9px;
    color: var(--yellow);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .panel-value {
    font-family: var(--font-display);
    font-size: 16px;
    color: var(--text);
  }

  #next, #hold { display: block; margin: 0 auto; }

  .overlay-msg {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--magenta);
    min-height: 20px;
    margin-bottom: 8px;
  }

  .btn {
    font-family: var(--font-display);
    font-size: 11px;
    padding: 10px 16px;
    background: transparent;
    border: 2px solid var(--magenta);
    color: var(--magenta);
    border-radius: 3px;
    cursor: pointer;
    width: 100%;
  }
  .btn:hover { background: var(--magenta); color: #102725; }

  .hint {
    margin-top: 20px;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.7;
  }

  .touch-controls {
    display: none;
    grid-template-columns: repeat(5, 52px);
    gap: 8px;
    justify-content: center;
    margin: 20px auto 0;
  }
  .touch-controls button {
    font-family: var(--font-display);
    background: var(--bg-panel-raised);
    border: 1px solid var(--line);
    color: var(--magenta);
    border-radius: 6px;
    font-size: 13px;
    height: 46px;
  }
  @media (hover: none) and (pointer: coarse) {
    .touch-controls { display: grid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ ДО ЗАЛИ</a>
  <h1 class="crt-flicker">БЛОКИ</h1>

  <div class="game-area">
    <div class="side-panel left">
      <div class="panel-box">
        <div class="panel-label">УТРИМАННЯ</div>
        <canvas id="hold" width="80" height="80"></canvas>
      </div>
    </div>

    <canvas id="board" width="240" height="480"></canvas>

    <div class="side-panel right">
      <div class="panel-box">
        <div class="panel-label">НАСТУПНА</div>
        <canvas id="next" width="100" height="100"></canvas>
      </div>
      <div class="panel-box">
        <div class="panel-label">РАХУНОК</div>
        <div class="panel-value" id="score">0</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">РІВЕНЬ</div>
        <div class="panel-value" id="level">1</div>
      </div>
      <div class="overlay-msg" id="msg"></div>
      <button class="btn" id="startBtn">▸ СТАРТ</button>
    </div>
  </div>

  <div class="touch-controls" id="touch">
    <button data-a="left">◂</button><button data-a="rotate">↻</button><button data-a="down">▼</button><button data-a="right">▸</button><button data-a="hold">HOLD</button>
  </div>

  <p class="hint">◂ ▸ рух · ▲ / пробіл поворот · ▼ м'яке падіння · Enter/Shift+↓ миттєве падіння · C — утримати фігуру</p>
</div>

<script src="../engine.js"></script>
<script>
const ctx = document.getElementById('board').getContext('2d');
const nctx = document.getElementById('next').getContext('2d');
const hctx = document.getElementById('hold').getContext('2d');
const COLS = 10, ROWS = 20, CELL = 24;

const sound = new Engine.SoundFX();
const particles = new Engine.Particles();
const shake = new Engine.ScreenShake();
Engine.mountMuteButton(sound, document.body);
Engine.mountFullscreenButton(document.body);

const COLORS = {
  I: '#00f0ff', O: '#ffe94d', T: '#ff2fd6',
  S: '#4dff88', Z: '#ff5c5c', J: '#5c8bff', L: '#ffab4d'
};

const SHAPES = {
  I: [[1,1,1,1]],
  O: [[1,1],[1,1]],
  T: [[0,1,0],[1,1,1]],
  S: [[0,1,1],[1,1,0]],
  Z: [[1,1,0],[0,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]]
};

let grid, current, next, holdPiece, canHold, score, level, dropMs, dropAcc, running, linesCleared;
let clearingRows, clearAnimT, loop, keyState, dasTimer, dasDir;

function emptyGrid() { return Array.from({length: ROWS}, () => Array(COLS).fill(null)); }

function randomPiece() {
  const keys = Object.keys(SHAPES);
  const key = keys[Math.floor(Math.random() * keys.length)];
  return { key, shape: SHAPES[key].map(r => r.slice()), x: Math.floor(COLS/2) - 1, y: 0 };
}

function rotateShape(shape) {
  const rows = shape.length, cols = shape[0].length;
  const out = Array.from({length: cols}, () => Array(rows).fill(0));
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      out[c][rows-1-r] = shape[r][c];
  return out;
}

function collides(shape, ox, oy) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const x = ox + c, y = oy + r;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
  }
  return false;
}

function ghostY() {
  let gy = current.y;
  while (!collides(current.shape, current.x, gy + 1)) gy++;
  return gy;
}

function merge() {
  current.shape.forEach((row, r) => row.forEach((v, c) => {
    if (v) {
      const y = current.y + r, x = current.x + c;
      if (y >= 0) grid[y][x] = current.key;
    }
  }));
}

function findFullRows() {
  const rowsFull = [];
  for (let r = 0; r < ROWS; r++) if (grid[r].every(v => v)) rowsFull.push(r);
  return rowsFull;
}

function applyClear(rowsFull) {
  rowsFull.forEach(r => particles.burst(COLS*CELL/2, r*CELL+CELL/2, '#ff2fd6', 10, {speed: 4, life: 20, spread: Math.PI*2}));
  rowsFull.slice().sort((a,b)=>a-b).forEach(r => { grid.splice(r,1); grid.unshift(Array(COLS).fill(null)); });
  const cleared = rowsFull.length;
  const points = [0, 100, 300, 500, 800][cleared];
  score += points * level;
  linesCleared += cleared;
  const newLevel = 1 + Math.floor(linesCleared / 10);
  if (newLevel > level) { sound.levelUp(); }
  level = newLevel;
  dropMs = Math.max(120, 700 - (level - 1) * 60);
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  sound.clear(cleared);
  if (cleared >= 4) shake.trigger(7, 12); else shake.trigger(3, 6);
}

function spawn() {
  current = next;
  next = randomPiece();
  canHold = true;
  drawNext();
  if (collides(current.shape, current.x, current.y)) gameOver();
}

function drawCell(c, x, y, color, alpha = 1) {
  c.globalAlpha = alpha;
  c.fillStyle = color;
  c.shadowColor = color;
  c.shadowBlur = 6;
  c.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
  c.shadowBlur = 0;
  c.globalAlpha = 1;
}

function render() {
  ctx.save();
  ctx.fillStyle = '#102725';
  ctx.fillRect(0, 0, COLS*CELL, ROWS*CELL);
  shake.apply(ctx);

  ctx.strokeStyle = 'rgba(42,51,82,0.35)';
  for (let i = 0; i <= COLS; i++) { ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,ROWS*CELL); ctx.stroke(); }
  for (let j = 0; j <= ROWS; j++) { ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(COLS*CELL,j*CELL); ctx.stroke(); }

  grid.forEach((row, r) => {
    const flashing = clearingRows && clearingRows.includes(r);
    row.forEach((v, c) => {
      if (v) drawCell(ctx, c, r, flashing ? '#ffffff' : COLORS[v]);
    });
  });

  if (current && !clearingRows) {
    const gy = ghostY();
    current.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) drawCell(ctx, current.x + c, gy + r, COLORS[current.key], 0.18);
    }));
    current.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) drawCell(ctx, current.x + c, current.y + r, COLORS[current.key]);
    }));
  }

  particles.draw(ctx);
  ctx.restore();

  if (!running && !clearingRows) return;
}

function drawMini(c, canvasEl, piece) {
  c.clearRect(0, 0, canvasEl.width, canvasEl.height);
  c.fillStyle = '#102725';
  c.fillRect(0, 0, canvasEl.width, canvasEl.height);
  if (!piece) return;
  const shape = piece.shape;
  const w = shape[0].length, h = shape.length;
  const cell = Math.min(20, (canvasEl.width - 10) / w);
  const ox = (canvasEl.width - w*cell) / 2, oy = (canvasEl.height - h*cell) / 2;
  shape.forEach((row, r) => row.forEach((v, c2) => {
    if (v) {
      c.fillStyle = COLORS[piece.key];
      c.fillRect(ox + c2*cell + 1, oy + r*cell + 1, cell-2, cell-2);
    }
  }));
}
function drawNext() { drawMini(nctx, document.getElementById('next'), next); }
function drawHold() { drawMini(hctx, document.getElementById('hold'), holdPiece); }

function lockPiece() {
  merge();
  sound.drop();
  const rowsFull = findFullRows();
  if (rowsFull.length) {
    clearingRows = rowsFull;
    clearAnimT = 14;
  } else {
    spawn();
  }
}

function softDrop() {
  if (collides(current.shape, current.x, current.y + 1)) {
    lockPiece();
  } else {
    current.y++;
    dropAcc = 0;
  }
}

function hardDrop() {
  if (!running || clearingRows) return;
  let dist = 0;
  while (!collides(current.shape, current.x, current.y + 1)) { current.y++; dist++; }
  score += dist * 2;
  document.getElementById('score').textContent = score;
  lockPiece();
  render();
}

function move(dx) {
  if (!running || clearingRows) return;
  if (!collides(current.shape, current.x + dx, current.y)) {
    current.x += dx;
    sound.move();
  }
}

function rotatePiece() {
  if (!running || clearingRows) return;
  const rotated = rotateShape(current.shape);
  const kicks = [0, -1, 1, -2, 2];
  for (const k of kicks) {
    if (!collides(rotated, current.x + k, current.y)) {
      current.shape = rotated;
      current.x += k;
      sound.rotate();
      return;
    }
  }
}

function doHold() {
  if (!running || clearingRows || !canHold) return;
  sound.hold();
  if (holdPiece) {
    const tmp = { key: holdPiece.key, shape: SHAPES[holdPiece.key].map(r => r.slice()), x: Math.floor(COLS/2)-1, y: 0 };
    holdPiece = { key: current.key, shape: SHAPES[current.key].map(r => r.slice()) };
    current = tmp;
  } else {
    holdPiece = { key: current.key, shape: SHAPES[current.key].map(r => r.slice()) };
    spawn();
  }
  canHold = false;
  drawHold();
}

function gameOver() {
  running = false;
  loop.stop();
  sound.hit();
  sound.gameOver();
  let best = 0;
  try { best = Number(localStorage.getItem('tetris_best') || 0); } catch (e) {}
  if (score > best) { try { localStorage.setItem('tetris_best', score); } catch (e) {} }
  const earned = Math.max(1, Math.floor(score / 100));
  Engine.CoinBank.add(earned);
  document.getElementById('msg').textContent = 'ГРУ ЗАВЕРШЕНО — РАХУНОК ' + score + ' · +' + earned + ' монет';
  document.getElementById('startBtn').textContent = '▸ ЗІГРАТИ ЩЕ РАЗ';
  render();
}

function update(dtSec) {
  if (!running) return;
  particles.update();
  shake.update();

  if (clearingRows) {
    clearAnimT--;
    if (clearAnimT <= 0) {
      applyClear(clearingRows);
      clearingRows = null;
      spawn();
    }
    return;
  }

  dropAcc += dtSec * 1000;
  if (dropAcc >= dropMs) {
    dropAcc = 0;
    if (collides(current.shape, current.x, current.y + 1)) {
      lockPiece();
    } else {
      current.y++;
    }
  }

  // DAS: утримання лівої/правої для авто-повтору руху
  if (dasDir !== 0) {
    dasTimer += dtSec * 1000;
    if (dasTimer > 160) {
      dasTimer -= 45;
      move(dasDir);
    }
  }
}

function start() {
  grid = emptyGrid();
  score = 0; level = 1; linesCleared = 0; dropMs = 700; dropAcc = 0;
  holdPiece = null; canHold = true; clearingRows = null;
  document.getElementById('score').textContent = 0;
  document.getElementById('level').textContent = 1;
  document.getElementById('msg').textContent = '';
  next = randomPiece();
  spawn();
  drawHold();
  running = true;
  if (loop) loop.stop();
  loop = new Engine.Loop(update, render);
  loop.start();
  document.getElementById('startBtn').textContent = '▸ РЕСТАРТ';
}

document.getElementById('startBtn').addEventListener('click', start);

dasDir = 0; dasTimer = 0;

window.addEventListener('keydown', e => {
  if (!running) return;
  switch (e.key) {
    case 'ArrowLeft':
      if (dasDir !== -1) { move(-1); dasDir = -1; dasTimer = 0; }
      break;
    case 'ArrowRight':
      if (dasDir !== 1) { move(1); dasDir = 1; dasTimer = 0; }
      break;
    case 'ArrowDown': softDrop(); break;
    case 'ArrowUp': case ' ': rotatePiece(); e.preventDefault(); break;
    case 'Enter': hardDrop(); break;
    case 'c': case 'C': doHold(); break;
  }
});
window.addEventListener('keyup', e => {
  if ((e.key === 'ArrowLeft' && dasDir === -1) || (e.key === 'ArrowRight' && dasDir === 1)) {
    dasDir = 0;
  }
});

document.getElementById('touch').addEventListener('click', e => {
  const a = e.target.dataset.a;
  if (a === 'left') move(-1);
  if (a === 'right') move(1);
  if (a === 'down') softDrop();
  if (a === 'rotate') rotatePiece();
  if (a === 'hold') doHold();
});

grid = emptyGrid();
render();
</script>
</body>
</html>
