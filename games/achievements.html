<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Досягнення — ІГРОТЕКА</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 70px; }
  .back {
    display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 12px;
    color: var(--text-dim); margin-bottom: 24px; border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 8px;
  }
  .back:hover { color: var(--yellow); border-color: var(--yellow); }
  header { text-align: center; margin-bottom: 32px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--text); margin: 0 0 8px; }
  .progress-text { color: var(--text-dim); font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
  .badge {
    background: var(--paper); border-radius: 14px; padding: 18px; text-align: center;
    box-shadow: 0 8px 0 -4px rgba(0,0,0,0.15), 0 12px 20px -10px rgba(0,0,0,0.35);
    opacity: 1;
  }
  .badge.locked { opacity: 0.4; filter: grayscale(0.6); }
  .badge .icon { font-size: 38px; margin-bottom: 10px; }
  .badge .name { font-family: var(--font-display); font-weight: 700; font-size: 14.5px; color: var(--ink); margin-bottom: 4px; }
  .badge .desc { font-size: 11.5px; color: #7a6b52; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← До полиці</a>
  <header>
    <h1>Досягнення</h1>
    <p class="progress-text" id="progress">0 з 0 відкрито</p>
  </header>
  <div class="grid" id="grid"></div>
</div>

<script src="engine.js"></script>
<script>
const grid = document.getElementById('grid');
const all = Engine.Achievements.all();
const unlockedIds = new Set(Engine.Achievements.unlocked().map(a => a.id));

document.getElementById('progress').textContent = `${unlockedIds.size} з ${all.length} відкрито`;

all.forEach(a => {
  const isUnlocked = unlockedIds.has(a.id);
  const el = document.createElement('div');
  el.className = 'badge' + (isUnlocked ? '' : ' locked');
  el.innerHTML = `
    <div class="icon">${isUnlocked ? a.icon : '🔒'}</div>
    <div class="name">${a.name}</div>
    <div class="desc">${a.desc}</div>
  `;
  grid.appendChild(el);
});
</script>
</body>
</html>
